<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Prospect Finder{% endblock %} · Roofing Prospect Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('pf.index') }}">Roofing Prospect Finder</a>
  <nav>
    <a href="{{ url_for('pf.index') }}">Prospects</a>
    <a href="{{ url_for('pf.import_page') }}">Import</a>
    <a href="{{ url_for('pf.duplicates') }}">Duplicates</a>
    <a href="{{ url_for('pf.rubric') }}">Scoring rubric</a>
    <a href="{{ url_for('pf.export_csv') }}">Export CSV</a>
    <a href="{{ url_for('pf.export_json') }}">Export JSON</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
